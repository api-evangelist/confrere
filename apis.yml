aid: confrere
name: Confrere
description: >-
  Confrere is a privacy-first, embeddable video-consultation platform (now a
  Compodium product) built in the Nordics for healthcare providers, therapists,
  consultants, tutors, and sales teams who need secure, encrypted video meetings
  that clients join from any modern browser with no download. Its server-side
  API mints single-use, one-minute room URLs that redirect a participant into a
  Confrere video room, and lets integrators invalidate a room or eject a
  specific user. Reliability is advertised at 99% across more than one million
  completed meetings. Backed by Point Nine.
